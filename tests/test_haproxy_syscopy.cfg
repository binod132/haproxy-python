#---------------------------------------------------------------------
# Global settings
#---------------------------------------------------------------------
global
    log /dev/log local0 info
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    maxconn 20000
    tune.ssl.default-dh-param 2048

    # Performance tuning (Linux)
    # Increase max socket connections
    # Note: tune these according to your system limits and resources
    ulimit-n 100000

#---------------------------------------------------------------------
# Default settings for all proxies
#---------------------------------------------------------------------
defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  http-server-close
    option  forwardfor           # Adds X-Forwarded-For header
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    retries 3
    maxconn 10000
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
cache cache_http
    total-max-size 100
    max-object-size 10
    max-age 60
#---------------------------------------------------------------------
# Frontend configuration
#---------------------------------------------------------------------
frontend http_front
    bind *:80
    acl path_test path_beg /test
    use_backend backend_servers if path_test

#---------------------------------------------------------------------
# Backend configuration
#---------------------------------------------------------------------
#backend backend_servers
#    balance roundrobin
##    server srv1 172.29.90.174:31239 weight 70 check fall 3 rise 2 inter 5s slowstart 30s
# server srv2 172.29.90.174:32570 weight 30 check fall 3 rise 2 inter 5s slowstart 30s
backend backend_servers
    balance roundrobin
    cookie SERVERID insert indirect nocache
    http-request cache-use cache_http
    http-response cache-store cache_http
    option httpchk GET /test HTTP/1.1\r\nHost:\ abc.com
    http-check expect status 200
    # server srv1 172.29.90.174:31239 weight 70 check fall 3 rise 2 inter 1s slowstart 30s cookie srv1
    server srv2 172.29.90.174:30264 weight 30 check fall 3 rise 2 inter 1s slowstart 30s cookie srv2
#---------------------------------------------------------------------
# HAProxy statistics page (optional, helpful in production)
#---------------------------------------------------------------------
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /haproxy_stats
    stats refresh 10s
    stats show-node
    stats auth admin:admin

